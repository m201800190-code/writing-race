<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة الكتابة السريعة - لوحة المعلم</title>
    <style>
        * { box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
        body {
            margin: 0; min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff; padding: 20px;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px; margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 26px; }
        .teacher { color: #90caf9; font-size: 15px; margin-top: 4px; }
        .btns { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            padding: 12px 22px; border: none; border-radius: 10px;
            font-size: 15px; font-weight: bold; cursor: pointer;
            transition: .2s;
        }
        .btn-announce { background: #ffb300; color: #333; }
        .btn-announce:hover { background: #ffa000; }
        .btn-clear { background: #e53935; color: #fff; }
        .btn-clear:hover { background: #c62828; }

        .pin-panel {
            background: linear-gradient(135deg, #ffd700, #ff8f00);
            color: #333; padding: 20px 30px; border-radius: 16px;
            display: flex; align-items: center; gap: 30px; flex-wrap: wrap;
            margin-bottom: 25px; box-shadow: 0 10px 30px rgba(255,179,0,.3);
        }
        .pin-panel .label { font-size: 18px; font-weight: bold; }
        .pin-panel .pin {
            font-size: 78px; font-weight: 900; font-family: 'Courier New', monospace;
            letter-spacing: 12px; background: rgba(255,255,255,.4);
            padding: 5px 25px; border-radius: 14px; line-height: 1;
        }
        .pin-panel .hint { font-size: 14px; opacity: .8; }

        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat {
            background: rgba(255,255,255,.1); padding: 12px 20px;
            border-radius: 10px; font-size: 14px;
        }
        .stat b { color: #ffb300; font-size: 18px; }

        table {
            width: 100%; border-collapse: collapse;
            background: rgba(255,255,255,.05); border-radius: 12px;
            overflow: hidden; backdrop-filter: blur(5px);
        }
        th, td { padding: 14px 12px; text-align: center; }
        th {
            background: rgba(0,0,0,.35); font-size: 14px;
            letter-spacing: .5px;
        }
        tr:nth-child(even) { background: rgba(255,255,255,.03); }
        tr:hover { background: rgba(255,255,255,.08); }
        .rank-1 { background: linear-gradient(90deg, #ffd700, #ffb300) !important; color: #333; font-weight: bold; }
        .rank-2 { background: linear-gradient(90deg, #e0e0e0, #bdbdbd) !important; color: #333; font-weight: bold; }
        .rank-3 { background: linear-gradient(90deg, #d7a86e, #b87333) !important; color: #fff; font-weight: bold; }
        .time { font-family: 'Courier New', monospace; font-weight: bold; color: #64ffda; font-size: 17px; }
        .rank-1 .time, .rank-2 .time, .rank-3 .time { color: inherit; }
        .empty { text-align: center; padding: 50px; color: #aaa; font-size: 20px; }
        .badge {
            display: inline-block; padding: 3px 12px; border-radius: 20px;
            font-size: 13px; background: #2a5298;
        }
        .correct { color: #4caf50; font-weight: bold; }
        .wrong { color: #ef5350; font-weight: bold; }

        /* شاشة الفائزين */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.94);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 999; padding: 20px;
            animation: fadeIn .4s;
        }
        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
        .overlay h2 {
            font-size: 52px; margin: 0 0 50px;
            background: linear-gradient(90deg,#ffd700,#ff8f00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .podium {
            display: flex; align-items: flex-end; gap: 25px;
            margin-bottom: 40px; flex-wrap: wrap; justify-content: center;
        }
        .winner {
            text-align: center; padding: 25px 30px;
            border-radius: 20px; min-width: 220px;
            animation: popIn .6s cubic-bezier(.34,1.56,.64,1) backwards;
        }
        .winner:nth-child(1) { animation-delay: .2s; }
        .winner:nth-child(2) { animation-delay: .5s; }
        .winner:nth-child(3) { animation-delay: .8s; }
        @keyframes popIn { from {transform:scale(0); opacity:0;} to {transform:scale(1); opacity:1;} }
        .w1 { background: linear-gradient(135deg,#ffd700,#ff8f00); color:#333; transform: scale(1.15); }
        .w2 { background: linear-gradient(135deg,#e0e0e0,#9e9e9e); color:#333; }
        .w3 { background: linear-gradient(135deg,#d7a86e,#8d5524); color:#fff; }
        .medal { font-size: 65px; display: block; margin-bottom: 10px; }
        .w-name { font-size: 24px; font-weight: bold; margin: 10px 0; }
        .w-class { font-size: 15px; opacity: .85; }
        .w-time { font-size: 30px; font-weight: bold; margin-top: 12px;
                  font-family: 'Courier New', monospace; }
        .close-btn {
            background: #e53935; color: #fff;
            padding: 15px 45px; font-size: 18px; border-radius: 10px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>📊 لوحة نتائج المسابقة</h1>
        <div class="teacher">أ. سالم الشبلي - تقنية المعلومات</div>
    </div>
    <div class="btns">
        <button class="btn-announce" onclick="showPodium()">🏆 إعلان النتائج</button>
        <button class="btn-clear" onclick="clearAll()">🗑️ مسح النتائج</button>
    </div>
</header>

<div class="pin-panel">
    <div>
        <div class="label">🔑 رقم الغرفة (PIN)</div>
        <div class="hint">اطلب من الطلاب إدخال هذا الرقم في صفحتهم</div>
    </div>
    <div class="pin" id="pinDisplay">------</div>
</div>

<div class="stats">
    <div class="stat">👥 عدد المشاركين: <b id="count">0</b></div>
    <div class="stat">🕐 آخر تحديث: <b id="lastUpdate">—</b></div>
    <div class="stat">🟢 الحالة: <b id="status">متصل</b></div>
</div>

<div id="tableWrap">
    <div class="empty">⏳ في انتظار مشاركة الطلاب...</div>
</div>

<!-- شاشة الفائزين -->
<div id="podiumOverlay" class="overlay hidden">
    <h2>🎉 الفائزون 🎉</h2>
    <div class="podium" id="podiumContent"></div>
    <button class="close-btn" onclick="closePodium()">إغلاق (Esc)</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB_7Zm84C0NMobbanWAn_HX_iVO3x90EAo",
        authDomain: "writing-race.firebaseapp.com",
        databaseURL: "https://writing-race-default-rtdb.firebaseio.com",
        projectId: "writing-race",
        storageBucket: "writing-race.firebasestorage.app",
        messagingSenderId: "336621141538",
        appId: "1:336621141538:web:e3fbc4f3215a8dd198547b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // إنشاء رقم غرفة ثابت لكل جلسة
    let pin = sessionStorage.getItem("currentPin");
    if (!pin) {
        pin = Math.floor(100000 + Math.random() * 900000).toString();
        sessionStorage.setItem("currentPin", pin);
    }
    document.getElementById("pinDisplay").textContent = pin;

    let currentResults = [];
    const resultsRef = ref(db, `rooms/${pin}/results`);

    onValue(resultsRef, (snapshot) => {
        const data = snapshot.val();
        currentResults = [];
        if (data) {
            Object.values(data).forEach(s => {
                if (s.name && typeof s.time === "number") currentResults.push(s);
            });
        }
        currentResults.sort((a, b) => a.time - b.time);
        renderTable(currentResults);
        document.getElementById("count").textContent = currentResults.length;
        document.getElementById("lastUpdate").textContent =
            new Date().toLocaleTimeString("ar-EG");
        document.getElementById("status").textContent = "متصل ✅";
    }, (err) => {
        document.getElementById("status").textContent = "خطأ ❌";
        console.error(err);
    });

    function renderTable(rows) {
        const wrap = document.getElementById("tableWrap");
        if (!rows.length) {
            wrap.innerHTML = '<div class="empty">⏳ في انتظار مشاركة الطلاب...</div>';
            return;
        }
        let html = `<table>
            <thead><tr>
                <th>#</th><th>الاسم</th><th>الصف</th>
                <th>الوقت (ث)</th><th>الحالة</th>
            </tr></thead><tbody>`;
        rows.forEach((r, i) => {
            const cls = i===0 ? "rank-1" : i===1 ? "rank-2" : i===2 ? "rank-3" : "";
            const medal = i===0 ? "🥇" : i===1 ? "🥈" : i===2 ? "🥉" : (i+1);
            const ok = r.correct ? '<span class="correct">✔ صحيحة</span>'
                                 : '<span class="wrong">✘ خاطئة</span>';
            html += `<tr class="${cls}">
                <td><b>${medal}</b></td>
                <td>${escapeHtml(r.name)}</td>
                <td><span class="badge">${escapeHtml(r.class)}</span></td>
                <td class="time">${Number(r.time).toFixed(3)}</td>
                <td>${ok}</td>
            </tr>`;
        });
        html += "</tbody></table>";
        wrap.innerHTML = html;
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
        })[c]);
    }

    window.showPodium = function() {
        if (!currentResults.length) { alert("لا توجد نتائج للإعلان عنها"); return; }
        const top3 = currentResults.slice(0, 3);
        const medals = ["🥇","🥈","🥉"];
        const wClasses = ["w1","w2","w3"];
        // ترتيب العرض: الفضية، الذهبية، البرونزية (لتظهر الأولى في الوسط)
        const order = top3.length >= 3 ? [1, 0, 2] : top3.map((_,i)=>i);

        let html = "";
        order.forEach(idx => {
            const r = top3[idx];
            if (!r) return;
            html += `<div class="winner ${wClasses[idx]}">
                <span class="medal">${medals[idx]}</span>
                <div class="w-name">${escapeHtml(r.name)}</div>
                <div class="w-class">${escapeHtml(r.class)}</div>
                <div class="w-time">${Number(r.time).toFixed(3)}s</div>
            </div>`;
        });
        document.getElementById("podiumContent").innerHTML = html;
        document.getElementById("podiumOverlay").classList.remove("hidden");
    };

    window.closePodium = function() {
        document.getElementById("podiumOverlay").classList.add("hidden");
    };

    window.clearAll = async function() {
        if (!confirm("⚠️ هل أنت متأكد من مسح جميع النتائج؟")) return;
        try {
            await remove(resultsRef);
            alert("✅ تم مسح جميع النتائج");
        } catch (e) {
            alert("حدث خطأ أثناء المسح");
            console.error(e);
        }
    };

    // اختصارات لوحة المفاتيح
    document.addEventListener("keydown", e => {
        if (e.code === "Space" && e.target === document.body) {
            e.preventDefault(); showPodium();
        }
        if (e.code === "Escape") closePodium();
    });
</script>
</body>
</html>
